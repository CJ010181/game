name: Build Windows exe
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-raylib
            mingw-w64-x86_64-pkg-config
      - name: Compile
        run: g++ main.cpp -o autobahn.exe -std=c++17 -O2 -static -mwindows $(pkg-config --cflags --static --libs raylib)
      - uses: actions/upload-artifact@v4
        with:
          name: autobahn-windows
          path: autobahn.exe
